services:
  fiber:
    image: nervos/fiber:${FIBER_VERSION:-0.9.0}
    environment:
      FIBER_SECRET_KEY_PASSWORD: ${FIBER_SECRET_KEY_PASSWORD:?set FIBER_SECRET_KEY_PASSWORD in .env.testnet}
      RUST_LOG: ${FIBER_RUST_LOG:-info}
    volumes:
      - ../.runtime/fiber-node:/fiber
    ports:
      - "${FIBER_P2P_PORT:-8228}:8228"
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD-SHELL", "fnn-cli info >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 8s
      start_period: 20s
      retries: 10

  facilitator:
    environment:
      FIBER_BACKEND: fnn
      FIBER_RPC_URL: http://fiber:8227
    depends_on:
      fiber:
        condition: service_healthy
